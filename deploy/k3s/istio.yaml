apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: chargepilot-gateway
  namespace: chargepilot
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
      - console-chargepilot.endusercompute.in
      - api-chargepilot.endusercompute.in
      - docs-chargepilot.endusercompute.in
      port:
        name: http
        number: 80
        protocol: HTTP
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: chargepilot-frontend
  namespace: chargepilot
spec:
  hosts:
    - console-chargepilot.endusercompute.in
  gateways:
    - chargepilot-gateway
  http:
    - route:
        - destination:
            host: chargepilot-frontend.chargepilot.svc.cluster.local
            port:
              number: 5173
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: chargepilot-api
  namespace: chargepilot
spec:
  hosts:
    - api-chargepilot.endusercompute.in
  gateways:
    - chargepilot-gateway
  http:
    - route:
        - destination:
            host: chargepilot-api.chargepilot.svc.cluster.local
            port:
              number: 8000
