apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargepilot-api
  labels:
    app.kubernetes.io/name: chargepilot
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chargepilot
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chargepilot
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: endusercompute/chargepilot-api:bootstrap-required
          command:
            - python
            - -c
            - "import socket,time; exec(\"while True:\\n try:\\n  socket.create_connection(('chargepilot-postgres',5432),timeout=3).close(); break\\n except OSError:\\n  time.sleep(2)\")"
      containers:
        - name: api
          image: endusercompute/chargepilot-api:bootstrap-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8000
          envFrom:
            - secretRef:
                name: chargepilot-runtime
            - secretRef:
                name: chargepilot-smtp
                optional: true
          env:
            - name: CHARGEPILOT_ENVIRONMENT
              value: production
            - name: CHARGEPILOT_SESSION_COOKIE_SECURE
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: api
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chargepilot-api
spec:
  selector:
    app.kubernetes.io/name: chargepilot
    app.kubernetes.io/component: api
  ports:
    - name: api
      port: 8000
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargepilot-frontend
  labels:
    app.kubernetes.io/name: chargepilot
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chargepilot
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chargepilot
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: endusercompute/chargepilot-frontend:bootstrap-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: frontend
              containerPort: 5173
          env:
            - name: CHARGEPILOT_ENVIRONMENT
              value: production
            - name: CHARGEPILOT_API_URL
              value: https://api-chargepilot.endusercompute.in
            - name: CHARGEPILOT_FRONTEND_URL
              value: https://console-chargepilot.endusercompute.in
            - name: CHARGEPILOT_TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: chargepilot-runtime
                  key: CHARGEPILOT_TURNSTILE_SITE_KEY
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /
              port: frontend
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: frontend
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: frontend
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chargepilot-frontend
spec:
  selector:
    app.kubernetes.io/name: chargepilot
    app.kubernetes.io/component: frontend
  ports:
    - name: frontend
      port: 5173
      targetPort: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargepilot-outbox-relay
  labels:
    app.kubernetes.io/name: chargepilot
    app.kubernetes.io/component: outbox-relay
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chargepilot
      app.kubernetes.io/component: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chargepilot
        app.kubernetes.io/component: outbox-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres-and-kafka
          image: endusercompute/chargepilot-api:bootstrap-required
          command:
            - python
            - -c
            - "import socket,time,urllib.error,urllib.request; targets=[('chargepilot-postgres',5432),('chargepilot-kafka',9092)]; exec(\"for host,port in targets:\\n while True:\\n  try:\\n   socket.create_connection((host,port),timeout=3).close(); break\\n  except OSError:\\n   time.sleep(2)\"); exec(\"while True:\\n try:\\n  urllib.request.urlopen('http://chargepilot-api:8000/ready',timeout=3).close(); break\\n except (urllib.error.URLError, OSError):\\n  time.sleep(2)\")"
      containers:
        - name: relay
          image: endusercompute/chargepilot-api:bootstrap-required
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers", "outbox-relay"]
          envFrom:
            - secretRef:
                name: chargepilot-runtime
          env:
            - name: CHARGEPILOT_ENVIRONMENT
              value: production
            - name: CHARGEPILOT_SESSION_COOKIE_SECURE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
