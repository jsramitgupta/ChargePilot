apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chargepilot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jsramitgupta/ChargePilot.git
    targetRevision: main
    path: deploy/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: chargepilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
