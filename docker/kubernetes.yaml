---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chargepilot-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chargepilot-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
