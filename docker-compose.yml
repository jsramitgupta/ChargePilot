services:
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${CHARGEPILOT_POSTGRES_DB:?Set CHARGEPILOT_POSTGRES_DB in .env}
      POSTGRES_USER: ${CHARGEPILOT_POSTGRES_USER:?Set CHARGEPILOT_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${CHARGEPILOT_POSTGRES_PASSWORD:?Set CHARGEPILOT_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    image: ${CHARGEPILOT_IMAGE:-chargepilot:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      CHARGEPILOT_ENVIRONMENT: production
      CHARGEPILOT_DATABASE_URL: postgresql+psycopg://${CHARGEPILOT_POSTGRES_USER:?Set CHARGEPILOT_POSTGRES_USER in .env}:${CHARGEPILOT_POSTGRES_PASSWORD:?Set CHARGEPILOT_POSTGRES_PASSWORD in .env}@db:5432/${CHARGEPILOT_POSTGRES_DB:?Set CHARGEPILOT_POSTGRES_DB in .env}
      CHARGEPILOT_SECRET_KEY: ${CHARGEPILOT_SECRET_KEY:?Set CHARGEPILOT_SECRET_KEY in .env}
      CHARGEPILOT_ENCRYPTION_KEY: ${CHARGEPILOT_ENCRYPTION_KEY:?Set CHARGEPILOT_ENCRYPTION_KEY in .env}
      CHARGEPILOT_ADMIN_USERNAME: ${CHARGEPILOT_ADMIN_USERNAME:?Set CHARGEPILOT_ADMIN_USERNAME in .env}
      CHARGEPILOT_ADMIN_PASSWORD: ${CHARGEPILOT_ADMIN_PASSWORD:?Set CHARGEPILOT_ADMIN_PASSWORD in .env}
      CHARGEPILOT_API_URL: ${CHARGEPILOT_API_URL:-http://localhost:8000}
      CHARGEPILOT_FRONTEND_URL: ${CHARGEPILOT_FRONTEND_URL:-http://localhost:5173}
      CHARGEPILOT_SESSION_COOKIE_SECURE: ${CHARGEPILOT_SESSION_COOKIE_SECURE:-true}
      CHARGEPILOT_SESSION_COOKIE_SAMESITE: ${CHARGEPILOT_SESSION_COOKIE_SAMESITE:-lax}
      CHARGEPILOT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHARGEPILOT_KAFKA_SECURITY_PROTOCOL: ${CHARGEPILOT_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CHARGEPILOT_KAFKA_SASL_MECHANISM: ${CHARGEPILOT_KAFKA_SASL_MECHANISM:-}
      CHARGEPILOT_KAFKA_SASL_USERNAME: ${CHARGEPILOT_KAFKA_SASL_USERNAME:-}
      CHARGEPILOT_KAFKA_SASL_PASSWORD: ${CHARGEPILOT_KAFKA_SASL_PASSWORD:-}
      CHARGEPILOT_KAFKA_SSL_CA_FILE: ${CHARGEPILOT_KAFKA_SSL_CA_FILE:-}
    ports:
      - "8000:8000"
      - "5173:5173"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2); urllib.request.urlopen('http://127.0.0.1:5173/', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  outbox-relay:
    image: ${CHARGEPILOT_IMAGE:-chargepilot:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.workers", "outbox-relay"]
    environment:
      CHARGEPILOT_ENVIRONMENT: production
      CHARGEPILOT_DATABASE_URL: postgresql+psycopg://${CHARGEPILOT_POSTGRES_USER:?Set CHARGEPILOT_POSTGRES_USER in .env}:${CHARGEPILOT_POSTGRES_PASSWORD:?Set CHARGEPILOT_POSTGRES_PASSWORD in .env}@db:5432/${CHARGEPILOT_POSTGRES_DB:?Set CHARGEPILOT_POSTGRES_DB in .env}
      CHARGEPILOT_SECRET_KEY: ${CHARGEPILOT_SECRET_KEY:?Set CHARGEPILOT_SECRET_KEY in .env}
      CHARGEPILOT_ENCRYPTION_KEY: ${CHARGEPILOT_ENCRYPTION_KEY:?Set CHARGEPILOT_ENCRYPTION_KEY in .env}
      CHARGEPILOT_ADMIN_USERNAME: ${CHARGEPILOT_ADMIN_USERNAME:?Set CHARGEPILOT_ADMIN_USERNAME in .env}
      CHARGEPILOT_ADMIN_PASSWORD: ${CHARGEPILOT_ADMIN_PASSWORD:?Set CHARGEPILOT_ADMIN_PASSWORD in .env}
      CHARGEPILOT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHARGEPILOT_KAFKA_SECURITY_PROTOCOL: ${CHARGEPILOT_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CHARGEPILOT_KAFKA_SASL_MECHANISM: ${CHARGEPILOT_KAFKA_SASL_MECHANISM:-}
      CHARGEPILOT_KAFKA_SASL_USERNAME: ${CHARGEPILOT_KAFKA_SASL_USERNAME:-}
      CHARGEPILOT_KAFKA_SASL_PASSWORD: ${CHARGEPILOT_KAFKA_SASL_PASSWORD:-}
      CHARGEPILOT_KAFKA_SSL_CA_FILE: ${CHARGEPILOT_KAFKA_SSL_CA_FILE:-}
      CHARGEPILOT_SESSION_COOKIE_SECURE: ${CHARGEPILOT_SESSION_COOKIE_SECURE:-true}
      CHARGEPILOT_SESSION_COOKIE_SAMESITE: ${CHARGEPILOT_SESSION_COOKIE_SAMESITE:-lax}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
      kafka:
        condition: service_healthy

  automation-worker:
    image: ${CHARGEPILOT_IMAGE:-chargepilot:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.workers", "automation-consumer"]
    environment:
      CHARGEPILOT_ENVIRONMENT: production
      CHARGEPILOT_DATABASE_URL: postgresql+psycopg://${CHARGEPILOT_POSTGRES_USER:?Set CHARGEPILOT_POSTGRES_USER in .env}:${CHARGEPILOT_POSTGRES_PASSWORD:?Set CHARGEPILOT_POSTGRES_PASSWORD in .env}@db:5432/${CHARGEPILOT_POSTGRES_DB:?Set CHARGEPILOT_POSTGRES_DB in .env}
      CHARGEPILOT_SECRET_KEY: ${CHARGEPILOT_SECRET_KEY:?Set CHARGEPILOT_SECRET_KEY in .env}
      CHARGEPILOT_ENCRYPTION_KEY: ${CHARGEPILOT_ENCRYPTION_KEY:?Set CHARGEPILOT_ENCRYPTION_KEY in .env}
      CHARGEPILOT_ADMIN_USERNAME: ${CHARGEPILOT_ADMIN_USERNAME:?Set CHARGEPILOT_ADMIN_USERNAME in .env}
      CHARGEPILOT_ADMIN_PASSWORD: ${CHARGEPILOT_ADMIN_PASSWORD:?Set CHARGEPILOT_ADMIN_PASSWORD in .env}
      CHARGEPILOT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHARGEPILOT_KAFKA_SECURITY_PROTOCOL: ${CHARGEPILOT_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CHARGEPILOT_KAFKA_SASL_MECHANISM: ${CHARGEPILOT_KAFKA_SASL_MECHANISM:-}
      CHARGEPILOT_KAFKA_SASL_USERNAME: ${CHARGEPILOT_KAFKA_SASL_USERNAME:-}
      CHARGEPILOT_KAFKA_SASL_PASSWORD: ${CHARGEPILOT_KAFKA_SASL_PASSWORD:-}
      CHARGEPILOT_KAFKA_SSL_CA_FILE: ${CHARGEPILOT_KAFKA_SSL_CA_FILE:-}
      CHARGEPILOT_SESSION_COOKIE_SECURE: ${CHARGEPILOT_SESSION_COOKIE_SECURE:-true}
      CHARGEPILOT_SESSION_COOKIE_SAMESITE: ${CHARGEPILOT_SESSION_COOKIE_SAMESITE:-lax}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
