name: Publish ChargePilot images and update k3s

on:
  workflow_run:
    workflows:
      - ChargePilot CI
    types:
      - completed
    branches:
      - main

# Security best practices:
# - This privileged workflow only consumes successful CI runs from this repository's main.
# - Registry credentials are used only after change detection and current-main checks.
# - Images are scanned by digest before GitOps is updated; deployment uses source-SHA tags.
# - contents:write is scoped to this deployment workflow only.
permissions:
  contents: read

concurrency:
  group: chargepilot-main-publish
  cancel-in-progress: ${{ github.event.workflow_run.conclusion == 'success' }}

jobs:
  detect:
    name: Determine changed deployable images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.current.outputs.publish }}
      api: ${{ steps.components.outputs.api }}
      frontend: ${{ steps.components.outputs.frontend }}
    steps:
      - name: Check out the tested source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip stale CI runs
        id: current
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_main" != "$SOURCE_SHA" ]; then
            echo "A newer main commit exists; its successful CI run will publish the accumulated changes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare components with their deployed source revisions
        id: components
        if: steps.current.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          source = subprocess.check_output(
              ["git", "rev-parse", os.environ["SOURCE_SHA"]], text=True
          ).strip()
          manifest = Path("deploy/k3s/kustomization.yaml").read_text()
          patterns = {
              "api": re.compile(r"(?ms)- name: endusercompute/chargepilot-api\s+newTag:\s*sha-([0-9a-f]{40})"),
              "frontend": re.compile(r"(?ms)- name: endusercompute/chargepilot-frontend\s+newTag:\s*sha-([0-9a-f]{40})"),
          }
          scopes = {
              "api": re.compile(r"^(app/|connector/|docker/Dockerfile$|pyproject.toml$|README.md$|\.dockerignore$)"),
              "frontend": re.compile(r"^(frontend/|app/frontend_server\.py$|\.dockerignore$)"),
          }

          for component, pattern in patterns.items():
              match = pattern.search(manifest)
              base = match.group(1) if match else None
              if not base or subprocess.run(
                  ["git", "cat-file", "-e", f"{base}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode:
                  changed = True
              else:
                  names = subprocess.check_output(
                      ["git", "diff", "--name-only", base, source], text=True
                  ).splitlines()
                  changed = any(scopes[component].search(name) for name in names)
              print(f"{component}={'true' if changed else 'false'}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"{component}={'true' if changed else 'false'}\n")
          PY

  publish:
    name: Build, scan, and publish ${{ matrix.component }}
    needs: detect
    if: >-
      needs.detect.outputs.publish == 'true' &&
      (needs.detect.outputs.api == 'true' || needs.detect.outputs.frontend == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            changed: ${{ needs.detect.outputs.api == 'true' }}
            image: endusercompute/chargepilot-api
            dockerfile: ./docker/Dockerfile
          - component: frontend
            changed: ${{ needs.detect.outputs.frontend == 'true' }}
            image: endusercompute/chargepilot-frontend
            dockerfile: ./frontend/Dockerfile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tested source commit
        if: matrix.changed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU for multi-platform builds
        if: matrix.changed
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        if: matrix.changed
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        if: matrix.changed
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: endusercompute
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate immutable image tag
        if: matrix.changed
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push multi-arch image
        if: matrix.changed
        id: image-build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=chargepilot-${{ matrix.component }}-publish
          cache-to: type=gha,mode=max,scope=chargepilot-${{ matrix.component }}-publish

      - name: Scan published AMD64 image for vulnerabilities and secrets
        if: matrix.changed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}@${{ steps.image-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Scan published ARM64 image for vulnerabilities and secrets
        if: matrix.changed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}@${{ steps.image-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          trivy-args: --platform linux/arm64

      - name: Report image publication and scan results
        if: matrix.changed
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "Source commit: \`${SOURCE_SHA}\`"
            echo "Image: \`${IMAGE}@${DIGEST}\` (AMD64 and ARM64 scanned)"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Update GitOps image tags
    needs:
      - detect
      - publish
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.publish == 'true' &&
      (needs.detect.outputs.api == 'true' || needs.detect.outputs.frontend == 'true') &&
      needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the tested source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Update only changed image tags in Argo CD manifests
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          API_CHANGED: ${{ needs.detect.outputs.api }}
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
        run: |
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_main" != "$SOURCE_SHA" ]; then
            echo "A newer main commit appeared during image publication; its run will update Argo CD."
            exit 0
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/k3s/kustomization.yaml")
          content = path.read_text()
          updated = content
          source_sha = os.environ["SOURCE_SHA"]
          for image, env_name in (
              ("chargepilot-api", "API_CHANGED"),
              ("chargepilot-frontend", "FRONTEND_CHANGED"),
          ):
              if os.environ[env_name] != "true":
                  continue
              pattern = rf"(?m)(- name: endusercompute/{image}\n\s+newTag:\s*)[^\n]+"
              updated, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + f"sha-{source_sha}",
                  updated,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Expected one {image} image entry in {path}, found {count}.")
          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k3s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Argo CD already references the published image tags."
            exit 0
          fi
          git commit -m "chore(deploy): update changed image tags"
          git push origin HEAD:refs/heads/main

      - name: Report GitOps promotion
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          API_CHANGED: ${{ needs.detect.outputs.api }}
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
        run: |
          {
            echo "Source commit: \`${SOURCE_SHA}\`"
            if [ "$API_CHANGED" = "true" ]; then
              echo "API image tag: \`sha-${SOURCE_SHA}\` (published and scanned)"
            else
              echo "API image: unchanged; promotion skipped."
            fi
            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "Frontend image tag: \`sha-${SOURCE_SHA}\` (published and scanned)"
            else
              echo "Frontend image: unchanged; promotion skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
