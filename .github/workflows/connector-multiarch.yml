name: Build and Push Site Connector Image

on:
  push:
    branches:
      - main
    paths:
      - "connector/Dockerfile"
      - "connector/requirements.txt"
      - "connector/*.py"
      - ".dockerignore"
  workflow_dispatch:

# Security best practices:
# - Only connector changes trigger publication; workflow_dispatch is an explicit rebuild.
# - Build and scan a local image before authenticating to Docker Hub.
# - Scan both published architectures by immutable digest before reporting success.
# - Use a read-only GITHUB_TOKEN and keep registry credentials in Actions secrets.
permissions:
  contents: read

concurrency:
  group: chargepilot-connector-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: endusercompute/chargepilot-connector

jobs:
  docker-build-and-push:
    name: Build, scan, and publish multi-arch connector
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build local connector image
        run: docker build --tag chargepilot-connector:ci -f connector/Dockerfile .

      - name: Scan connector image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: chargepilot-connector:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: endusercompute
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate immutable commit image tag
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,format=long

      - name: Build and push AMD64 + ARM64 connector image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Scan published connector AMD64 image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Scan published connector ARM64 image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          trivy-args: --platform linux/arm64

      - name: Report immutable image reference
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published and scanned \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
