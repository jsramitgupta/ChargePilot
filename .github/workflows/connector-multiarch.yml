name: Build and Push Site Connector Image

on:
  push:
    branches:
      - main
    paths:
      - "connector/**"
      - ".dockerignore"
      - ".github/workflows/connector-multiarch.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: endusercompute/chargepilot-connector

jobs:
  docker-build-and-push:
    name: Build multi-arch site connector and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: endusercompute
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate immutable commit image tag
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,format=long

      - name: Build and push AMD64 + ARM64 connector image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Report immutable image reference
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
