name: Build and Publish Windows Site Connector

on:
  push:
    branches:
      - main
    paths:
      - "connector/*.py"
      - "connector/requirements.txt"
      - ".github/workflows/connector-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chargepilot-connector-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build, smoke-test, and publish Windows executable
    runs-on: windows-2022
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install connector and packaging dependencies
        run: python -m pip install -r connector/requirements.txt pyinstaller==6.14.2

      - name: Build self-contained executable
        run: >-
          pyinstaller --noconfirm --clean --onefile
          --name ChargePilotConnector
          --collect-all tinytuya
          --collect-all websockets
          --hidden-import windows_service
          --hidden-import connector.windows_service
          connector/chargepilot_connector.py

      - name: Smoke-test packaged executable
        run: connector/dist/ChargePilotConnector.exe --help

      - name: Publish commit-addressed Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $tag = "connector-sha-$env:GITHUB_SHA"
          $asset = "connector/dist/ChargePilotConnector.exe"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset `
              --target $env:GITHUB_SHA `
              --title "ChargePilot site connector $($env:GITHUB_SHA.Substring(0, 12))" `
              --notes "Unsigned Windows self-contained connector executable. Source commit: $env:GITHUB_SHA." `
              --prerelease
          }
