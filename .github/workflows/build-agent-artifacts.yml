name: Build endpoint agent artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "agents-v*"
    paths:
      - "agent/**"
      - ".github/workflows/build-agent-artifacts.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/build-agent-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: agent/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargepilot-android-debug-apk
          path: agent/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build iOS device app
        run: |
          xcodebuild \
            -project agent/ios/ChargePilotAgent.xcodeproj \
            -scheme ChargePilotAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/chargepilot-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          app_path="$RUNNER_TEMP/chargepilot-ios/Build/Products/Release-iphoneos/ChargePilotAgent.app"
          package_dir="$RUNNER_TEMP/chargepilot-ipa"
          test -d "$app_path"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/ChargePilotAgent.app"
          (cd "$package_dir" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/ChargePilotAgent-0.1.0-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargepilot-ios-unsigned-ipa
          path: ChargePilotAgent-0.1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

  macos:
    name: Build macOS development DMG
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build DMG
        run: ./agent/macos/scripts/build-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargepilot-macos-development-dmg
          path: agent/macos/dist/ChargePilotAgent-0.1.0.dmg
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Build Windows service agent
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Test Windows agent contract
        run: dotnet test agent/windows/tests/ChargePilotAgent.Core.Tests/ChargePilotAgent.Core.Tests.csproj --configuration Release

      - name: Build Windows service executable
        shell: powershell
        run: |
          .\agent\windows\BuildAgentExe.ps1 `
            -OutputPath "$env:RUNNER_TEMP\ChargePilotAgent.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargepilot-windows-exe
          path: ${{ runner.temp }}/ChargePilotAgent.exe
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/agents-v')
    needs:
      - android
      - ios
      - macos
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Download Android APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chargepilot-android-debug-apk
          path: artifacts

      - name: Download iOS IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chargepilot-ios-unsigned-ipa
          path: artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chargepilot-macos-development-dmg
          path: artifacts

      - name: Download Windows executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chargepilot-windows-exe
          path: artifacts

      - name: Package public agent source downloads
        run: |
          python3 - <<'PY'
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout.decode().split("\0")
          tracked = [Path(path) for path in tracked if path]
          targets = {
              "android": "chargepilot-android-agent-source.zip",
              "ios": "chargepilot-ios-agent-source.zip",
              "macos": "chargepilot-macos-agent-source.zip",
          }
          for platform, archive_name in targets.items():
              prefix = Path("agent") / platform
              sources = [path for path in tracked if path.is_relative_to(prefix)]
              if not sources:
                  raise SystemExit(f"No tracked {platform} agent files found")
              with zipfile.ZipFile(
                  root / "artifacts" / archive_name,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
              ) as archive:
                  for path in sources:
                      archive.write(
                          root / path,
                          Path(f"chargepilot-{platform}-agent") / path.relative_to(prefix),
                      )

          windows_files = [
              path
              for path in tracked
              if path.is_relative_to(Path("agent/windows"))
              and "bin" not in path.parts
              and "obj" not in path.parts
          ]
          windows_files.extend(
              [
                  Path("agent/BatteryAgent.ps1"),
                  Path("agent/CreateAgentScheduledTask.ps1"),
              ]
          )
          with zipfile.ZipFile(
              root / "artifacts" / "chargepilot-windows-agent-source.zip",
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as archive:
              for source in windows_files:
                  archive.write(
                      root / source,
                      Path("chargepilot-windows-agent") / source.relative_to("agent"),
                  )

          for source, asset in (
              ("agent/BatteryAgent.ps1", "chargepilot-windows-battery-agent.ps1"),
              (
                  "agent/windows/install.ps1",
                  "chargepilot-windows-agent-installer.ps1",
              ),
          ):
              (root / "artifacts" / asset).write_bytes((root / source).read_bytes())
          PY

      - name: Publish development builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --title "ChargePilot endpoint agents $TAG" \
            --latest \
            --notes "Development builds and source archives generated from this tag. The Windows executable installs a Windows service, provides an elevated configuration UI and CLI, and is unsigned. The Android APK is debug-signed. The iOS IPA is unsigned and requires signing before installation. The macOS DMG is unsigned and not notarized."
