name: Build endpoint agent artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "agents-v*"
    paths:
      - "agent/android/**"
      - "agent/ios/**"
      - "agent/macos/**"
      - ".github/workflows/build-agent-artifacts.yml"
  pull_request:
    paths:
      - "agent/android/**"
      - "agent/ios/**"
      - "agent/macos/**"
      - ".github/workflows/build-agent-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: agent/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargepilot-android-debug-apk
          path: agent/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build iOS device app
        run: |
          xcodebuild \
            -project agent/ios/ChargePilotAgent.xcodeproj \
            -scheme ChargePilotAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/chargepilot-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          app_path="$RUNNER_TEMP/chargepilot-ios/Build/Products/Release-iphoneos/ChargePilotAgent.app"
          package_dir="$RUNNER_TEMP/chargepilot-ipa"
          test -d "$app_path"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/ChargePilotAgent.app"
          (cd "$package_dir" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/ChargePilotAgent-0.1.0-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargepilot-ios-unsigned-ipa
          path: ChargePilotAgent-0.1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

  macos:
    name: Build macOS development DMG
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build DMG
        run: ./agent/macos/scripts/build-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargepilot-macos-development-dmg
          path: agent/macos/dist/ChargePilotAgent-0.1.0.dmg
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/agents-v')
    needs:
      - android
      - ios
      - macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chargepilot-android-debug-apk
          path: artifacts

      - name: Download iOS IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chargepilot-ios-unsigned-ipa
          path: artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chargepilot-macos-development-dmg
          path: artifacts

      - name: Publish development builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --title "ChargePilot endpoint agents $TAG" \
            --notes "Development builds generated from this tag. The Android APK is debug-signed. The iOS IPA is unsigned and requires signing before installation. The macOS DMG is unsigned and not notarized."
