[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chargepilot"
version = "0.1.0"
description = "Self-hosted laptop battery automation for local Tuya control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.134.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.30.1",
  "sqlalchemy==2.0.32",
  "psycopg[binary]==3.2.1",
  "pydantic-settings==2.3.4",
  "httpx==0.27.0",
  "bcrypt==4.1.2",
  "cryptography==50.0.2",
  "itsdangerous==2.2.0",
  "tinytuya==1.20.0",
  "tuya-device-sharing-sdk==0.2.15",
  "qrcode[pil]==8.0",
  "tzdata==2024.1",
  "aiokafka==0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-asyncio==0.23.8",
  "ruff==0.5.7",
]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.core",
  "app.models",
  "app.schemas",
  "app.services",
  "connector",
]

[tool.pytest.ini_options]
pythonpath = ["."]

testpaths = ["tests"]
